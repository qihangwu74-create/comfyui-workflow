name: Deploy ComfyUI workflow library

on:
  push:
    branches: [main]
    paths:
      - ".github/upload-parts/**"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and unpack library
        shell: bash
        run: |
          cat .github/upload-parts/part-* > /tmp/comfyui-workflow-library.zip
          unzip -oq /tmp/comfyui-workflow-library.zip -d .
          rm -rf .github/upload-parts
          rm -f .github/workflows/deploy-library.yml
      - name: Commit expanded library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy reusable ComfyUI design workflow library"
            git push
          fi
